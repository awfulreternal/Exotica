[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exotica-userbot"
version = "0.3.0"
description = "Exotica Telegram userbot powered by the Hikka-derived Heroku runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Exotica contributors" }]
dependencies = [
	"herokutl==2.2.1",
	"pyaes==1.6.1",
	"GitPython==3.1.50",
	"deep-translator==1.11.4",
	"meval==2.5",
	"aiohttp==3.13.5",
	"requests==2.33.1",
	"grapheme==0.6.0",
	"emoji==2.16.0",
	"psutil==6.0.0",
	"rsa==4.9",
	"ruamel.yaml==0.17.21",
	"orjson==3.13.0",
	"Pillow==13.0.0",
]

[project.optional-dependencies]
legacy = ["Telethon>=1.36,<2"]

[project.scripts]
exotica = "exotica.cli:main"

[tool.setuptools.packages.find]
where = [".", "vendor/heroku"]
include = ["exotica*", "heroku*", "assets*"]

[tool.setuptools]
license-files = ["LICENSE", "vendor/heroku/LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
assets = ["*"]
heroku = ["langpacks/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
